name: CubeGame unified documentation
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'Factory/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'PROJECT_MEMORY.md'
      - '.github/workflows/character-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test local Factory documentation validator
        run: python3 -B Factory/scripts/test_verify_character_docs.py
      - name: Validate both directories in single repository
        run: python3 -B Factory/scripts/verify_character_docs.py --factoria Factory --cubegame .
